<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrishiNova AI - ಕನ್ನಡ ಧ್ವನಿ ಸಹಾಯಕ</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i data-lucide="leaf"></i>
                <h1>KrishiNova AI</h1>
            </div>
            <p>ಕೃಷಿ ಮಾಹಿತಿ ಮತ್ತು ಸಹಾಯಕ್ಕಾಗಿ ಮಾತಾಡಿ</p>
        </header>

        <main>
            <div id="chat-area" class="chat-area">
                <div class="message ai-message">
                    ನಮಸ್ಕಾರ! ನಾನು ನಿಮ್ಮ ಕೃಷಿನೋವಾ ಧ್ವನಿ ಸಹಾಯಕ. ನಾನು ನಿಮಗೆ ಹೇಗೆ ಸಹಾಯ ಮಾಡಲಿ?
                </div>
            </div>

            <div class="controls">
                <div id="status" class="status">ಪ್ರಾರಂಭಿಸಲು ಮೈಕ್ರೊಫೋನ್ ಒತ್ತಿರಿ</div>
                
                <button id="mic-btn" class="mic-btn">
                    <i data-lucide="mic" id="mic-icon"></i>
                    <div class="pulse-ring"></div>
                </button>

                <div class="waves" id="waves">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
